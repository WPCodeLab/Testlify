<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QA Visual Tester</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Syne:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0f0e;--bg2:#131614;--bg3:#1a1d1b;--bg4:#222622;
  --border:#2a2e2a;--border2:#3a3f3a;
  --text:#d4d9d4;--text2:#8a8f8a;--text3:#5a5f5a;
  --green:#4ade80;--green2:#22c55e;--green-dim:#1a3d26;
  --red:#f87171;--red2:#ef4444;--red-dim:#3d1a1a;
  --amber:#fbbf24;--amber-dim:#3d2f0a;
  --blue:#60a5fa;--blue-dim:#0a2040;
  --mono:'JetBrains Mono',monospace;
  --sans:'Syne',sans-serif;
  --radius:6px;--radius-lg:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:14px;min-height:100vh;line-height:1.5}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* TOP NAV */
.nav{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--border);background:var(--bg2);position:sticky;top:0;z-index:100}
.nav-brand{font-family:var(--sans);font-size:18px;font-weight:700;letter-spacing:-.02em;color:#fff}
.nav-brand span{color:var(--green);font-family:var(--mono);font-weight:400;font-size:13px;margin-left:10px;opacity:.7}
.nav-actions{display:flex;gap:8px;align-items:center}
.btn{padding:8px 16px;border-radius:var(--radius);border:1px solid var(--border2);background:transparent;cursor:pointer;font-size:13px;font-family:var(--mono);color:var(--text);transition:all .15s}
.btn:hover{background:var(--bg3);border-color:var(--text3);color:#fff;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-green{border-color:var(--green);color:var(--green)}.btn-green:hover{background:var(--green-dim);box-shadow:0 4px 12px rgba(74,222,128,.2)}
.btn-red{border-color:var(--red);color:var(--red)}.btn-red:hover{background:var(--red-dim)}
.btn-report{border-color:var(--blue);color:var(--blue);font-weight:500}.btn-report:hover{background:var(--blue-dim);box-shadow:0 4px 12px rgba(96,165,250,.2)}

/* URL BAR */
.url-bar{padding:18px 28px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:center}
.url-label{font-size:12px;color:var(--text3);white-space:nowrap;letter-spacing:.06em;text-transform:uppercase}
.url-input{flex:1;padding:10px 14px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);font-family:var(--mono);font-size:14px;outline:none;transition:border .15s,box-shadow .15s}
.url-input:focus{border-color:var(--green);color:#fff;box-shadow:0 0 0 3px rgba(74,222,128,.1)}
.url-input::placeholder{color:var(--text3)}
.url-open-btn{padding:9px 18px;background:var(--green-dim);border:1px solid var(--green);border-radius:var(--radius);color:var(--green);font-family:var(--mono);font-size:13px;cursor:pointer;white-space:nowrap;transition:all .15s}
.url-open-btn:hover{background:var(--green);color:#000;transform:translateY(-1px)}
.session-info{font-size:12px;color:var(--text3);white-space:nowrap}

/* STATS */
.stats-bar{display:flex;gap:8px;padding:20px 28px;background:var(--bg);border-bottom:1px solid var(--border)}
.stat{flex:1;padding:16px 20px;background:var(--bg2);border-radius:8px;text-align:center;border:1px solid var(--border);transition:border-color .2s}
.stat:hover{border-color:var(--border2)}
.stat-n{font-size:28px;font-weight:600;font-family:var(--sans);line-height:1}
.stat-l{font-size:12px;color:var(--text3);margin-top:5px;text-transform:uppercase;letter-spacing:.06em}
.pbar-wrap{padding:0 28px 20px;background:var(--bg)}
.pbar{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden}
.pfill{height:100%;background:var(--green2);border-radius:3px;transition:width .4s ease;box-shadow:0 0 10px rgba(74,222,128,.5)}
.pct{font-size:12px;color:var(--text3);text-align:right;margin-top:6px}

/* MAIN */
.main{display:flex;gap:0}
.sidebar{width:240px;min-width:240px;border-right:1px solid var(--border);height:calc(100vh - 230px);overflow-y:auto;position:sticky;top:230px;background:var(--bg2)}
.sidebar-item{padding:12px 20px;cursor:pointer;font-size:13px;color:var(--text2);border-left:3px solid transparent;transition:all .15s;display:flex;align-items:center;justify-content:space-between}
.sidebar-item:hover{background:var(--bg3);color:var(--text)}
.sidebar-item.active{color:var(--green);border-left-color:var(--green);background:var(--green-dim)}
.sidebar-item.all-pass{color:var(--green2)}
.sidebar-item.has-fail{color:var(--red)}
.sidebar-dot{width:8px;height:8px;border-radius:50%;background:var(--border2);flex-shrink:0}
.sidebar-dot.pass{background:var(--green2)}.sidebar-dot.fail{background:var(--red2)}.sidebar-dot.partial{background:var(--amber)}

.content{flex:1;padding:24px 28px;max-width:920px}

/* CATEGORY */
.cat-header{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin:4px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--border)}

/* STEP */
.step{background:var(--bg2);border:1px solid var(--border);border-radius:8px;margin-bottom:12px;overflow:hidden;transition:border-color .2s,box-shadow .2s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.step:hover{box-shadow:0 4px 16px rgba(0,0,0,.4)}
.step.pass{border-color:rgba(34,197,94,.3);border-left:3px solid var(--green2)}
.step.fail{border-color:rgba(239,68,68,.3);border-left:3px solid var(--red2)}
.step-head{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none}
.step-head:hover{background:var(--bg3)}
.snum{font-size:12px;color:var(--text3);min-width:28px;font-weight:500}
.sname{flex:1;font-size:14px;color:var(--text);font-weight:400}
.step.pass .sname{color:var(--green)}
.step.fail .sname{color:var(--red)}
.sbadge{font-size:11px;padding:3px 10px;border-radius:4px;font-weight:500;border:1px solid}
.sbadge-open{background:var(--bg3);color:var(--text3);border-color:var(--border)}
.sbadge-pass{background:var(--green-dim);color:var(--green);border-color:rgba(74,222,128,.3)}
.sbadge-fail{background:var(--red-dim);color:var(--red);border-color:rgba(248,113,113,.3)}
.sarr{font-size:11px;color:var(--text3);transition:transform .2s}
.sarr.open{transform:rotate(180deg)}

.step-body{display:none;padding:0 16px 16px;border-top:1px solid var(--border)}
.step-body.open{display:block}
.sdesc{font-size:13px;color:var(--text2);margin:12px 0;line-height:1.75;padding:12px 14px;background:var(--bg3);border-radius:6px;border-left:3px solid var(--border2)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.warn-msg{font-size:13px;color:var(--amber);background:var(--amber-dim);padding:8px 12px;border-radius:6px;margin-bottom:10px;display:none;border:1px solid rgba(251,191,36,.2)}
.warn-msg.show{display:block}

/* NOTES */
.notes-row{margin-bottom:12px}
.notes-label{font-size:12px;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.notes-inp{width:100%;padding:8px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--mono);font-size:13px;outline:none;resize:none;min-height:56px;transition:border .15s,box-shadow .15s;line-height:1.6}
.notes-inp:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(74,222,128,.1)}

/* BUGS */
.bugs-section{margin-top:12px}
.bugs-label{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.bug-item{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;background:var(--bg3);border:1px solid var(--border);border-left:3px solid var(--red2);border-radius:6px;margin-bottom:6px;transition:box-shadow .15s}
.bug-item:hover{box-shadow:0 2px 8px rgba(0,0,0,.3)}
.bug-text{flex:1;font-size:13px;color:var(--text);line-height:1.6}
.bug-text.res{text-decoration:line-through;color:var(--text3)}
.bug-resolve{padding:4px 10px;font-size:12px;border-radius:4px;border:1px solid var(--green-dim);background:transparent;cursor:pointer;color:var(--green);font-family:var(--mono);transition:all .15s}
.bug-resolve:hover{background:var(--green-dim)}
.bug-done{font-size:12px;color:var(--green);opacity:.6}
.bug-add-row{display:flex;gap:8px;margin-top:8px}
.bug-inp{flex:1;padding:8px 12px;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-family:var(--mono);font-size:13px;outline:none;transition:border .15s,box-shadow .15s}
.bug-inp:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(248,113,113,.1)}
.bug-inp::placeholder{color:var(--text3)}

/* FINAL */
.final-card{margin:24px 0;padding:24px;border-radius:10px;border:1px solid;display:none}
.final-card.show{display:block}
.final-card.ok{border-color:var(--green);background:var(--green-dim);box-shadow:0 4px 20px rgba(74,222,128,.1)}
.final-card.no{border-color:var(--red);background:var(--red-dim);box-shadow:0 4px 20px rgba(248,113,113,.1)}
.final-title{font-family:var(--sans);font-size:18px;font-weight:700;margin-bottom:8px}
.final-card.ok .final-title{color:var(--green)}
.final-card.no .final-title{color:var(--red)}
.final-sub{font-size:13px;color:var(--text2);line-height:1.6}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:none;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.modal-overlay.show{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:28px;width:480px;max-width:90vw;box-shadow:0 24px 64px rgba(0,0,0,.8)}
.modal-title{font-family:var(--sans);font-size:18px;font-weight:700;margin-bottom:8px;color:#fff}
.modal-sub{font-size:13px;color:var(--text2);margin-bottom:20px;line-height:1.65}
.modal-input{width:100%;padding:10px 14px;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;color:#fff;font-family:var(--mono);font-size:14px;outline:none;margin-bottom:14px;transition:border .15s,box-shadow .15s}
.modal-input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(74,222,128,.1)}
.modal-acts{display:flex;gap:8px;justify-content:flex-end}
.sessions-list{max-height:240px;overflow-y:auto;margin-bottom:16px}
.session-row{padding:12px 14px;border:1px solid var(--border);border-radius:6px;margin-bottom:6px;cursor:pointer;transition:all .15s}
.session-row:hover{border-color:var(--green);background:var(--green-dim)}
.session-row-url{font-size:13px;color:var(--text)}
.session-row-meta{font-size:12px;color:var(--text3);margin-top:4px}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-brand">QA Tester <span>v1.0</span></div>
  <div class="nav-actions">
    <button class="btn" onclick="showSessions()">Sessions</button>
    <button class="btn btn-red" onclick="resetCurrent()">Reset</button>
    <button class="btn btn-report" onclick="goReport()">View Report →</button>
  </div>
</nav>

<div class="url-bar">
  <span class="url-label">Target URL</span>
  <input class="url-input" id="urlInput" type="text" placeholder="https://example.com" value="">
  <button class="url-open-btn" onclick="openTarget()">Open in New Tab ↗</button>
  <span class="session-info" id="sessionInfo">no session</span>
</div>

<div class="stats-bar">
  <div class="stat"><div class="stat-n" id="st-total">30</div><div class="stat-l">Total</div></div>
  <div class="stat"><div class="stat-n" id="st-pass" style="color:var(--green)">0</div><div class="stat-l">Passed</div></div>
  <div class="stat"><div class="stat-n" id="st-fail" style="color:var(--red)">0</div><div class="stat-l">Failed</div></div>
  <div class="stat"><div class="stat-n" id="st-pend" style="color:var(--text3)">30</div><div class="stat-l">Pending</div></div>
  <div class="stat"><div class="stat-n" id="st-bugs" style="color:var(--amber)">0</div><div class="stat-l">Open Bugs</div></div>
</div>
<div class="pbar-wrap">
  <div class="pbar"><div class="pfill" id="prog" style="width:0%"></div></div>
  <div class="pct" id="pct">0% complete</div>
</div>

<div class="main">
  <div class="sidebar" id="sidebar"></div>
  <div class="content" id="content"></div>
</div>

<div class="final-card" id="finalCard">
  <div class="final-title" id="finalTitle"></div>
  <div class="final-sub" id="finalSub"></div>
</div>

<!-- New Session Modal -->
<div class="modal-overlay" id="newSessionModal">
  <div class="modal">
    <div class="modal-title">New Test Session</div>
    <div class="modal-sub">Enter the URL of the site you want to test. A new session will be created and saved to your browser storage.</div>
    <input class="modal-input" id="newSessionUrl" type="text" placeholder="https://example.com">
    <input class="modal-input" id="newSessionName" type="text" placeholder="Session name (optional)">
    <select class="modal-input" id="newSessionType" style="cursor:pointer">
      <option value="visual">Visual Testing (30 steps)</option>
      <option value="form">Form Testing (31 steps)</option>
    </select>
    <div class="modal-acts">
      <button class="btn" onclick="closeModal('newSessionModal')">Cancel</button>
      <button class="btn btn-green" onclick="createSession()">Create Session</button>
    </div>
  </div>
</div>

<!-- Sessions List Modal -->
<div class="modal-overlay" id="sessionsModal">
  <div class="modal">
    <div class="modal-title">Test Sessions</div>
    <div class="modal-sub">Select a session to continue, or create a new one.</div>
    <div class="sessions-list" id="sessionsList"></div>
    <div class="modal-acts">
      <button class="btn" onclick="closeModal('sessionsModal')">Close</button>
      <button class="btn btn-green" onclick="closeModal('sessionsModal');showNewSession()">+ New Session</button>
    </div>
  </div>
</div>

<script>
const STEPS_DEF = [
  { cat: "Layout & Structure", steps: [
    { n: "Viewport meta tag", d: "Check <meta name='viewport'> is present. Page scales correctly on all device sizes. No zoom issues on mobile." },
    { n: "Grid / column alignment", d: "All columns align to the grid system. Check at 320px, 768px, 1280px, 1920px. No broken or misaligned layouts." },
    { n: "No horizontal overflow", d: "No unwanted horizontal scrollbar at any breakpoint. Check every page section. Inspect overflow-x on body." },
    { n: "Z-index stacking order", d: "Dropdowns, modals, tooltips, sticky headers — all appear above correct elements. No clipping or hidden overlaps." },
    { n: "Footer position", d: "Footer sits at bottom of page even on short-content pages. No gap between content and footer. Check on mobile too." },
  ]},
  { cat: "Typography", steps: [
    { n: "Web fonts load correctly", d: "Fonts render as designed — no FOUT (flash of unstyled text) or fallback fonts visible in final state. Check slow network." },
    { n: "Heading hierarchy H1→H3", d: "Only one H1 per page. H2 under H1, H3 under H2. No skipped levels. Visual size matches semantic rank." },
    { n: "Text contrast WCAG AA", d: "Body text 4.5:1 ratio, large text 3:1 minimum against background. Use browser DevTools or Colour Contrast Analyser." },
    { n: "Text truncation & overflow", d: "Long strings don't break layouts. Ellipsis shows in truncated elements. No text spills outside its container." },
  ]},
  { cat: "Images & Media", steps: [
    { n: "All images have alt text", d: "Every <img> has meaningful alt attribute. Decorative images use alt=''. Check with DevTools or screen reader." },
    { n: "No broken images", d: "Every image loads correctly. No broken icon shown. Check Network tab — zero 404s on image assets." },
    { n: "Image aspect ratios correct", d: "No squished or stretched images. srcset / sizes attributes set correctly. Check on retina and low-res screens." },
    { n: "Video autoplay policy", d: "Videos do not autoplay with sound. Controls visible and functional. Poster frame set. Muted autoplay is acceptable." },
  ]},
  { cat: "Forms", steps: [
    { n: "Required fields block submit", d: "Leave all required fields empty. Click submit. Form must NOT submit — all required fields show error messages." },
    { n: "Email & phone validation", d: "Enter invalid: 'abc', 'abc@', '@x.com', too-short phone, letters in phone. All must fail. Valid formats pass." },
    { n: "Password rules enforced", d: "Enter weak passwords: '123', 'password'. Rules displayed: min length, uppercase, symbol. Strong password passes." },
    { n: "Whitespace-only input rejected", d: "Enter only spaces in required text fields. Must fail validation — not treated as valid non-empty input." },
    { n: "Double-submit prevented", d: "Click submit once. Button disables immediately. Only ONE network request sent. No duplicate records created." },
    { n: "Success state shown clearly", d: "Submit valid form. Clear success message appears with context. No raw JSON, no blank page, no silent fail." },
    { n: "Server error handled gracefully", d: "Disconnect network or trigger server error. User-friendly error message shown. No JS crash, no raw stack trace." },
    { n: "Form labels linked to inputs", d: "Every input has <label for='id'> or aria-label. Clicking label focuses its field. Screen reader announces correctly." },
  ]},
  { cat: "Interactivity", steps: [
    { n: "All links work", d: "No dead href='#' links in final UI. External links open new tab with rel='noopener noreferrer'. No 404 destinations." },
    { n: "Button states styled", d: "All buttons have: default, hover, active, focus, disabled states styled. Focus ring visible for keyboard users." },
    { n: "Keyboard navigation works", d: "Tab through entire page. Focus order is logical top→bottom left→right. No keyboard traps. Enter triggers buttons." },
    { n: "Mobile touch targets ≥ 44px", d: "All interactive elements are at least 44×44px on mobile. No overlapping tap areas. Test on real device or DevTools." },
  ]},
  { cat: "Responsive Behavior", steps: [
    { n: "Mobile layout (320px)", d: "Open DevTools → 320px width. All content visible and usable. No text overflow. Navigation collapses correctly." },
    { n: "Tablet layout (768px)", d: "Check layout at 768px. Columns rearrange correctly. Images resize. Touch targets still large enough." },
    { n: "Tables responsive", d: "Data tables scroll horizontally on small screens or collapse to card layout. No data cut off or hidden." },
  ]},
  { cat: "Performance & Console", steps: [
    { n: "Zero console errors", d: "Open browser console. Load page, navigate, submit forms. Zero red errors. Warnings reviewed and justified." },
    { n: "Zero 404 assets", d: "Open Network tab. Reload page. Filter by status 404. Zero missing scripts, styles, fonts, or images." },
    { n: "Animations run at 60fps", d: "All transitions and animations are smooth. No jank on scroll. Only transform/opacity animated (not layout props)." },
  ]},
  { cat: "SEO & Meta", steps: [
    { n: "Favicon & page title", d: "Browser tab shows correct favicon (not default browser icon) and meaningful <title> tag. Not 'Untitled Document'." },
    { n: "Open Graph tags present", d: "og:title, og:description, og:image all set with correct values. Test by pasting URL into social preview tool." },
  ]}
];

const FORM_STEPS_DEF = [
  { cat: "Field Validation", steps: [
    { n: "Required fields block submit", d: "Leave all required fields empty. Click submit. Form must NOT submit — show error on each required field." },
    { n: "Email format validation", d: "Enter invalid emails: 'abc', 'abc@', '@test.com', 'a@b'. All must fail. Enter valid email — must pass." },
    { n: "Phone number format", d: "Enter letters, special chars, too-short/long numbers. Check format mask or error. Valid number must pass." },
    { n: "Min / max length enforced", d: "Enter 1 char in fields with minlength. Paste 10,000 chars in fields with maxlength. Both must be caught." },
    { n: "Number field — non-numeric input", d: "Type letters into number input. Field must reject or show error. Min/max range limits enforced." },
    { n: "Password strength rules", d: "Enter weak password (e.g. '123'). Rules must show: min length, uppercase, symbol requirements." },
    { n: "Password confirm match", d: "Enter mismatched passwords. Error must show on blur or submit. Matching passwords clears error." },
    { n: "URL field format", d: "Enter 'notaurl', 'ftp://', blank. Each must fail. 'https://example.com' must pass." },
  ]},
  { cat: "User Input Behavior", steps: [
    { n: "Paste into fields works", d: "Paste text into every field. Content should populate correctly. No silent strip or corruption." },
    { n: "Autofill / autocomplete", d: "Use browser autofill on name, email, address fields. Values populate. Form state updates correctly." },
    { n: "Copy from read-only fields", d: "Read-only fields (e.g. reference numbers) allow text selection and copy. Cannot be edited." },
    { n: "Tab key order", d: "Tab through entire form. Focus moves top-to-bottom, left-to-right. No skip, no trap, no jump to wrong field." },
    { n: "Special characters in text fields", d: "Enter: <script>, ' OR 1=1--, emoji 🎉, unicode ñ, null byte. All stored/displayed safely. No crash or injection." },
    { n: "Whitespace-only input", d: "Enter only spaces in required text fields. Must fail validation — not treated as valid input." },
    { n: "Leading/trailing spaces trimmed", d: "Enter ' john ' in name field. On submit, stored value should be 'john' (trimmed). Check in response or DB." },
  ]},
  { cat: "Submit & Response", steps: [
    { n: "Submit button disabled after click", d: "Click submit once. Button must disable immediately to prevent double-submit. Re-enables on error." },
    { n: "Loading state shows", d: "After submit, spinner or loading indicator appears. User knows request is in progress." },
    { n: "Success message on valid submit", d: "Fill form correctly, submit. Clear success message appears. No raw JSON or blank page." },
    { n: "Error on server failure", d: "Simulate server error (disconnect network or use bad endpoint). User-friendly error message shows. No crash." },
    { n: "Form data sent correctly", d: "Open DevTools Network tab. Submit form. Check request payload — all field values present and correct." },
    { n: "Redirect after success", d: "If form redirects on success, check destination URL is correct. Back button behavior is expected." },
  ]},
  { cat: "Edge Cases", steps: [
    { n: "Submit empty form directly", d: "Skip to submit with nothing filled. All required field errors show simultaneously. No partial submission." },
    { n: "Rapid repeated submit", d: "Click submit 5 times fast. Only ONE request sent. No duplicate records created." },
    { n: "Browser back after submit", d: "Submit form, then hit browser back. Form should not re-submit. Data should not duplicate." },
    { n: "Refresh on success page", d: "After submit success, refresh the page. Must NOT re-submit the form. Show neutral state." },
    { n: "Very long input values", d: "Enter 1000+ chars in text fields. Page layout must not break. Value truncated or error shown cleanly." },
    { n: "Dropdown with no selection", d: "Leave required select/dropdown unselected. Submit blocked. Error shown pointing to dropdown." },
  ]},
  { cat: "Accessibility & UX", steps: [
    { n: "Error messages are descriptive", d: "Errors must say WHAT is wrong: not just red border. E.g. 'Email must include @' not 'Invalid'." },
    { n: "Labels linked to inputs", d: "Every input has <label for='id'> or aria-label. Screen reader announces field name on focus." },
    { n: "Keyboard-only form completion", d: "Complete and submit entire form using only keyboard. Zero mouse interaction. Must fully work." },
    { n: "Error focus management", d: "After failed submit, focus moves to first error field. Screen reader users know where to start fixing." },
  ]}
];

const TEST_TYPES = {
  visual: { label: 'Visual Testing', def: STEPS_DEF },
  form:   { label: 'Form Testing',   def: FORM_STEPS_DEF }
};

let ALL_STEPS = [];

function buildSteps(type) {
  ALL_STEPS = [];
  let idx = 1;
  const def = (TEST_TYPES[type] || TEST_TYPES.visual).def;
  def.forEach(c => c.steps.forEach(s => {
    ALL_STEPS.push({ ...s, id: idx++, cat: c.cat });
  }));
}

buildSteps('visual');

let currentSessionId = null;

function getSessions() {
  try { return JSON.parse(localStorage.getItem('qa_sessions') || '[]'); } catch { return []; }
}
function saveSessions(s) { localStorage.setItem('qa_sessions', JSON.stringify(s)); }
function getCurrentSession() {
  const ss = getSessions();
  return ss.find(s => s.id === currentSessionId) || null;
}
function saveCurrentSession(session) {
  const ss = getSessions();
  const i = ss.findIndex(s => s.id === currentSessionId);
  if (i >= 0) ss[i] = session; else ss.push(session);
  saveSessions(ss);
}

function newSessionData(url, name, type) {
  buildSteps(type);
  const steps = {};
  ALL_STEPS.forEach(s => { steps[s.id] = { status: 'open', bugs: [], notes: '' }; });
  return {
    id: Date.now().toString(),
    url: url,
    name: name || url,
    type: type || 'visual',
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString(),
    steps
  };
}

function loadSession(id) {
  currentSessionId = id;
  localStorage.setItem('qa_current_session', id);
  const session = getCurrentSession();
  if (session) buildSteps(session.type || 'visual');
  render();
}

function showNewSession() {
  document.getElementById('newSessionUrl').value = '';
  document.getElementById('newSessionName').value = '';
  document.getElementById('newSessionType').value = 'visual';
  document.getElementById('newSessionModal').classList.add('show');
}

function createSession() {
  const url = document.getElementById('newSessionUrl').value.trim();
  const name = document.getElementById('newSessionName').value.trim();
  const type = document.getElementById('newSessionType').value;
  if (!url) { alert('Enter a URL'); return; }
  const session = newSessionData(url, name, type);
  const ss = getSessions();
  ss.push(session);
  saveSessions(ss);
  currentSessionId = session.id;
  localStorage.setItem('qa_current_session', session.id);
  closeModal('newSessionModal');
  render();
}

function showSessions() {
  const ss = getSessions();
  const list = document.getElementById('sessionsList');
  if (ss.length === 0) {
    list.innerHTML = '<div style="font-size:11px;color:var(--text3);padding:10px">No sessions yet.</div>';
  } else {
    list.innerHTML = ss.slice().reverse().map(s => {
      const steps = Object.values(s.steps);
      const passed = steps.filter(x => x.status === 'pass').length;
      const failed = steps.filter(x => x.status === 'fail').length;
      const d = new Date(s.createdAt);
      return `<div class="session-row" onclick="closeModal('sessionsModal');loadSession('${s.id}')">
        <div class="session-row-url">${s.name || s.url}</div>
        <div class="session-row-meta">${d.toLocaleDateString()} ${d.toLocaleTimeString()} &nbsp;|&nbsp; ${TEST_TYPES[s.type]?.label || 'Visual'} &nbsp;|&nbsp; ${passed} pass / ${failed} fail / ${steps.length - passed - failed} pending</div>
      </div>`;
    }).join('');
  }
  document.getElementById('sessionsModal').classList.add('show');
}

function closeModal(id) { document.getElementById(id).classList.remove('show'); }

function openTarget() {
  const url = document.getElementById('urlInput').value.trim();
  if (!url) { alert('Enter a URL first'); return; }
  const session = getCurrentSession();
  if (session) {
    session.url = url;
    session.name = session.name === session.url ? url : session.name;
    saveCurrentSession(session);
    updateSessionInfo(session);
  }
  window.open(url, '_blank', 'noopener');
}

function resetCurrent() {
  if (!currentSessionId) return;
  if (!confirm('Reset all steps for this session? Bugs and notes will be cleared.')) return;
  const ss = getSessions();
  const i = ss.findIndex(s => s.id === currentSessionId);
  if (i >= 0) {
    buildSteps(ss[i].type || 'visual');
    ss[i].steps = {};
    ALL_STEPS.forEach(s => { ss[i].steps[s.id] = { status: 'open', bugs: [], notes: '' }; });
    ss[i].updatedAt = new Date().toISOString();
    saveSessions(ss);
  }
  render();
}

function goReport() {
  if (!currentSessionId) { alert('No active session'); return; }
  window.open('report.html?session=' + currentSessionId, '_blank');
}

function getStepState(stepId) {
  const session = getCurrentSession();
  if (!session) return { status: 'open', bugs: [], notes: '' };
  return session.steps[stepId] || { status: 'open', bugs: [], notes: '' };
}

function updateStep(stepId, updates) {
  const session = getCurrentSession();
  if (!session) return;
  const st = session.steps[stepId] || { status: 'open', bugs: [], notes: '' };
  Object.assign(st, updates);
  st.updatedAt = new Date().toISOString();
  session.steps[stepId] = st;
  session.updatedAt = new Date().toISOString();
  saveCurrentSession(session);
}

function openBugs(stepId) {
  const st = getStepState(stepId);
  return st.bugs.filter(b => !b.resolved).length;
}

function totalOpenBugs() {
  return ALL_STEPS.reduce((a, s) => a + openBugs(s.id), 0);
}

let expanded = {};

function updateSessionInfo(session) {
  if (session) {
    document.getElementById('sessionInfo').textContent = session.name || session.url;
    document.getElementById('urlInput').value = session.url || '';
  } else {
    document.getElementById('sessionInfo').textContent = 'no session';
  }
}

function updateStats() {
  const session = getCurrentSession();
  const steps = session ? Object.values(session.steps) : [];
  const passed = steps.filter(x => x.status === 'pass').length;
  const failed = steps.filter(x => x.status === 'fail').length;
  const total = ALL_STEPS.length;
  const pending = total - passed - failed;
  const done = passed + failed;
  const bugs = totalOpenBugs();

  document.getElementById('st-total').textContent = total;
  document.getElementById('st-pass').textContent = passed;
  document.getElementById('st-fail').textContent = failed;
  document.getElementById('st-pend').textContent = pending;
  document.getElementById('st-bugs').textContent = bugs;
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('prog').style.width = pct + '%';
  document.getElementById('pct').textContent = pct + '% complete (' + done + '/' + total + ')';

  // Final card
  const fc = document.getElementById('finalCard');
  if (total > 0 && done === total) {
    fc.classList.add('show');
    if (failed === 0 && bugs === 0) {
      fc.className = 'final-card show ok';
      document.getElementById('finalTitle').textContent = '✓ All ' + total + ' steps passed — site is clean.';
      document.getElementById('finalSub').textContent = 'No open bugs. Ready to ship. View full report for details.';
    } else {
      fc.className = 'final-card show no';
      document.getElementById('finalTitle').textContent = '✗ Cannot accept — ' + bugs + ' open bug' + (bugs !== 1 ? 's' : '') + ' on ' + failed + ' failed step' + (failed !== 1 ? 's' : '') + '.';
      document.getElementById('finalSub').textContent = 'Resolve all bugs and re-verify failed steps before sign-off. View Report for full breakdown.';
    }
  } else {
    fc.classList.remove('show');
  }
}

function renderSidebar() {
  const cats = [...new Set(ALL_STEPS.map(s => s.cat))];
  const session = getCurrentSession();
  let html = '';
  cats.forEach(cat => {
    const catSteps = ALL_STEPS.filter(s => s.cat === cat);
    const passed = catSteps.filter(s => session && session.steps[s.id]?.status === 'pass').length;
    const failed = catSteps.filter(s => session && session.steps[s.id]?.status === 'fail').length;
    const allPass = passed === catSteps.length;
    const hasFail = failed > 0;
    const cls = allPass ? 'all-pass' : hasFail ? 'has-fail' : '';
    const dot = allPass ? 'pass' : hasFail ? 'fail' : passed > 0 ? 'partial' : '';
    html += `<div class="sidebar-item ${cls}" onclick="scrollToCat('${cat.replace(/'/g, '')}')">
      <span>${cat}</span>
      <span class="sidebar-dot ${dot}"></span>
    </div>`;
  });
  document.getElementById('sidebar').innerHTML = html;
}

function scrollToCat(cat) {
  const el = document.getElementById('cat-' + cat.replace(/\s+/g, '-'));
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderContent() {
  const session = getCurrentSession();
  if (!session) {
    document.getElementById('content').innerHTML = `
      <div style="padding:40px;text-align:center;color:var(--text3)">
        <div style="font-family:var(--sans);font-size:20px;font-weight:700;color:var(--text2);margin-bottom:12px">No Active Session</div>
        <div style="font-size:12px;margin-bottom:20px">Create a new session to start testing.</div>
        <button class="btn btn-green" onclick="showNewSession()">+ New Test Session</button>
      </div>`;
    return;
  }

  let html = '';
  let curCat = '';
  ALL_STEPS.forEach(step => {
    if (step.cat !== curCat) {
      curCat = step.cat;
      const catId = 'cat-' + curCat.replace(/\s+/g, '-');
      html += `<div id="${catId}" class="cat-header">${curCat}</div>`;
    }

    const st = session.steps[step.id] || { status: 'open', bugs: [], notes: '' };
    const ob = openBugs(step.id);
    const exp = expanded[step.id] || false;
    const badgeClass = 'sbadge sbadge-' + st.status;
    const badgeTxt = st.status === 'pass' ? 'pass' : st.status === 'fail' ? (ob > 0 ? ob + ' bug' + (ob > 1 ? 's' : '') : 'fail') : 'pending';

    html += `<div class="step ${st.status}" id="step-${step.id}">
      <div class="step-head" onclick="tog(${step.id})">
        <span class="snum">${String(step.id).padStart(2, '0')}</span>
        <span class="sname">${step.n}</span>
        <span class="${badgeClass}">${badgeTxt}</span>
        <span class="sarr ${exp ? 'open' : ''}">▼</span>
      </div>
      <div class="step-body ${exp ? 'open' : ''}">
        <div class="sdesc">${escHtml(step.d)}</div>
        <div class="warn-msg ${st.status === 'fail' && ob > 0 ? 'show' : ''}" id="warn-${step.id}">
          ⚠ ${ob} open bug${ob !== 1 ? 's' : ''} must be resolved before marking this step as passed.
        </div>
        <div class="acts">
          <button class="btn btn-green" onclick="setSt(${step.id},'pass')">✓ Pass</button>
          <button class="btn btn-red" onclick="doFail(${step.id})">✗ Fail + log bug</button>
          ${st.status !== 'open' ? `<button class="btn" onclick="setSt(${step.id},'open')">↺ Reset</button>` : ''}
        </div>
        <div class="notes-row">
          <div class="notes-label">Notes</div>
          <textarea class="notes-inp" id="notes-${step.id}" placeholder="Add test notes, observations..." onblur="saveNotes(${step.id})">${st.notes || ''}</textarea>
        </div>
        <div class="bugs-section">
          ${st.bugs.length ? '<div class="bugs-label">Bugs logged</div>' : ''}
          ${st.bugs.map((b, i) => `
            <div class="bug-item">
              <span class="bug-text ${b.resolved ? 'res' : ''}">${escHtml(b.text)}</span>
              ${!b.resolved
                ? `<button class="bug-resolve" onclick="resolveB(${step.id},${i})">resolved ✓</button>`
                : `<span class="bug-done">✓ fixed</span>`}
            </div>`).join('')}
          <div class="bug-add-row" id="badd-${step.id}" style="display:${st.status === 'fail' ? 'flex' : 'none'}">
            <input class="bug-inp" id="bi-${step.id}" placeholder="Describe the bug..." onkeydown="if(event.key==='Enter')addB(${step.id})">
            <button class="btn" onclick="addB(${step.id})">Add bug</button>
          </div>
        </div>
      </div>
    </div>`;
  });

  document.getElementById('content').innerHTML = html;
}

function render() {
  const session = getCurrentSession();
  updateSessionInfo(session);
  renderSidebar();
  renderContent();
  updateStats();
}

function tog(id) {
  expanded[id] = !expanded[id];
  render();
}

function setSt(id, s) {
  if (s === 'pass' && openBugs(id) > 0) {
    expanded[id] = true;
    render();
    return;
  }
  updateStep(id, { status: s });
  render();
}

function doFail(id) {
  updateStep(id, { status: 'fail' });
  expanded[id] = true;
  render();
  setTimeout(() => {
    const inp = document.getElementById('bi-' + id);
    if (inp) { inp.parentElement.style.display = 'flex'; inp.focus(); }
  }, 50);
}

function addB(id) {
  const inp = document.getElementById('bi-' + id);
  const txt = inp ? inp.value.trim() : '';
  if (!txt) return;
  const st = getStepState(id);
  st.bugs.push({ text: txt, resolved: false, createdAt: new Date().toISOString() });
  updateStep(id, { bugs: st.bugs });
  render();
  setTimeout(() => {
    const a = document.getElementById('badd-' + id);
    if (a) a.style.display = 'flex';
  }, 50);
}

function resolveB(id, i) {
  const st = getStepState(id);
  st.bugs[i].resolved = true;
  st.bugs[i].resolvedAt = new Date().toISOString();
  updateStep(id, { bugs: st.bugs });
  render();
}

function saveNotes(id) {
  const el = document.getElementById('notes-' + id);
  if (el) updateStep(id, { notes: el.value });
}

// Init
window.addEventListener('click', e => {
  ['newSessionModal', 'sessionsModal'].forEach(id => {
    const el = document.getElementById(id);
    if (e.target === el) closeModal(id);
  });
});

const savedId = localStorage.getItem('qa_current_session');
if (savedId && getSessions().find(s => s.id === savedId)) {
  currentSessionId = savedId;
  const _s = getCurrentSession();
  if (_s) buildSteps(_s.type || 'visual');
  render();
} else {
  render();
  showNewSession();
}
</script>
</body>
</html>
