<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QA Report</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Syne:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0f0e;--bg2:#131614;--bg3:#1a1d1b;--bg4:#222622;
  --border:#2a2e2a;--border2:#3a3f3a;
  --text:#d4d9d4;--text2:#8a8f8a;--text3:#5a5f5a;
  --green:#4ade80;--green2:#22c55e;--green-dim:#1a3d26;
  --red:#f87171;--red2:#ef4444;--red-dim:#3d1a1a;
  --amber:#fbbf24;--amber-dim:#3d2f0a;
  --blue:#60a5fa;--blue-dim:#0a2040;
  --mono:'JetBrains Mono',monospace;
  --sans:'Syne',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:13px;min-height:100vh}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border2)}

/* PRINT */
@media print{
  body{background:#fff;color:#000}
  .no-print{display:none!important}
  .page{max-width:100%;padding:0}
  .grade-card{border:2px solid #000}
}

.nav{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--border);background:var(--bg2)}
.nav-brand{font-family:var(--sans);font-size:15px;font-weight:700;color:#fff}
.nav-brand span{color:var(--green);font-family:var(--mono);font-weight:400;font-size:12px;margin-left:8px;opacity:.7}
.nav-acts{display:flex;gap:8px}
.btn{padding:6px 14px;border-radius:4px;border:1px solid var(--border2);background:transparent;cursor:pointer;font-size:11px;font-family:var(--mono);color:var(--text);transition:all .15s}
.btn:hover{background:var(--bg3);color:#fff}
.btn-green{border-color:var(--green);color:var(--green)}.btn-green:hover{background:var(--green-dim)}

.page{max-width:860px;margin:0 auto;padding:32px 24px}

/* HEADER */
.report-header{margin-bottom:32px}
.report-tag{font-size:10px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.report-title{font-family:var(--sans);font-size:28px;font-weight:800;color:#fff;line-height:1.1;margin-bottom:8px}
.report-url{font-size:12px;color:var(--blue);margin-bottom:4px}
.report-meta{font-size:11px;color:var(--text3)}

/* GRADE */
.grade-row{display:grid;grid-template-columns:auto 1fr;gap:20px;margin-bottom:32px;align-items:stretch}
.grade-card{padding:24px 28px;border-radius:8px;border:1px solid;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.grade-letter{font-family:var(--sans);font-size:64px;font-weight:800;line-height:1}
.grade-label{font-size:11px;margin-top:4px;text-transform:uppercase;letter-spacing:.08em}
.grade-A{border-color:var(--green);background:var(--green-dim)}.grade-A .grade-letter{color:var(--green)}.grade-A .grade-label{color:var(--green)}
.grade-B{border-color:#86efac;background:#143524}.grade-B .grade-letter{color:#86efac}.grade-B .grade-label{color:#86efac}
.grade-C{border-color:var(--amber);background:var(--amber-dim)}.grade-C .grade-letter{color:var(--amber)}.grade-C .grade-label{color:var(--amber)}
.grade-D{border-color:#fb923c;background:#3d1f0a}.grade-D .grade-letter{color:#fb923c}.grade-D .grade-label{color:#fb923c}
.grade-F{border-color:var(--red);background:var(--red-dim)}.grade-F .grade-letter{color:var(--red)}.grade-F .grade-label{color:var(--red)}

.metrics-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px}
.metric{padding:16px;background:var(--bg2);text-align:center;border-radius:4px}
.metric-n{font-family:var(--sans);font-size:26px;font-weight:700;line-height:1}
.metric-l{font-size:10px;color:var(--text3);margin-top:3px;text-transform:uppercase;letter-spacing:.06em}

/* VERDICT */
.verdict{padding:16px 20px;border-radius:6px;border:1px solid;margin-bottom:28px}
.verdict.pass{border-color:var(--green);background:var(--green-dim)}
.verdict.fail{border-color:var(--red);background:var(--red-dim)}
.verdict-title{font-family:var(--sans);font-size:15px;font-weight:700;margin-bottom:4px}
.verdict.pass .verdict-title{color:var(--green)}
.verdict.fail .verdict-title{color:var(--red)}
.verdict-body{font-size:11px;color:var(--text2);line-height:1.6}

/* PROGRESS BARS */
.cat-summary{margin-bottom:28px}
.section-title{font-family:var(--sans);font-size:12px;font-weight:700;color:var(--text2);letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.cat-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.cat-name{font-size:11px;color:var(--text2);min-width:160px}
.cat-bar-wrap{flex:1;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden}
.cat-bar{height:100%;border-radius:3px;transition:width .4s}
.cat-bar.full{background:var(--green2)}
.cat-bar.partial{background:var(--amber)}
.cat-bar.none{background:var(--border2)}
.cat-pct{font-size:10px;color:var(--text3);min-width:40px;text-align:right}
.cat-status{font-size:10px;min-width:50px;text-align:right}

/* STEPS TABLE */
.steps-section{margin-bottom:28px}
.steps-table{width:100%;border-collapse:collapse}
.steps-table th{text-align:left;font-size:10px;color:var(--text3);font-weight:500;letter-spacing:.06em;text-transform:uppercase;padding:8px 12px;border-bottom:1px solid var(--border)}
.steps-table td{padding:8px 12px;border-bottom:1px solid var(--border);font-size:11px;vertical-align:top}
.steps-table tr:hover td{background:var(--bg2)}
.badge{display:inline-block;padding:2px 8px;border-radius:3px;font-size:10px;font-weight:500;border:1px solid}
.badge-pass{background:var(--green-dim);color:var(--green);border-color:var(--green-dim)}
.badge-fail{background:var(--red-dim);color:var(--red);border-color:var(--red-dim)}
.badge-open{background:var(--bg3);color:var(--text3);border-color:var(--border)}

/* BUGS */
.bugs-section{margin-bottom:28px}
.bug-card{background:var(--bg2);border:1px solid var(--border);border-radius:6px;margin-bottom:8px;overflow:hidden}
.bug-card-head{padding:10px 14px;background:var(--bg3);border-bottom:1px solid var(--border);font-size:11px;font-weight:500;display:flex;align-items:center;justify-content:space-between}
.bug-card-head .step-ref{color:var(--text3);font-size:10px}
.bug-list{padding:8px 14px}
.bug-row{padding:6px 0;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:8px;font-size:11px}
.bug-row:last-child{border-bottom:none}
.bug-dot{width:6px;height:6px;border-radius:50%;margin-top:4px;flex-shrink:0}
.bug-dot.open{background:var(--red2)}.bug-dot.resolved{background:var(--green2)}
.bug-txt{flex:1;color:var(--text)}
.bug-txt.res{text-decoration:line-through;color:var(--text3)}
.bug-status{font-size:10px;color:var(--text3);flex-shrink:0}

/* NOTES */
.notes-section{margin-bottom:28px}
.note-row{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:10px 14px;margin-bottom:6px}
.note-step{font-size:10px;color:var(--text3);margin-bottom:4px}
.note-text{font-size:11px;color:var(--text2);line-height:1.6}

/* FOOTER */
.report-footer{border-top:1px solid var(--border);padding-top:16px;margin-top:32px;display:flex;align-items:center;justify-content:space-between}
.footer-brand{font-family:var(--sans);font-size:12px;color:var(--text3)}
.footer-time{font-size:10px;color:var(--text3)}

/* NO SESSION */
.no-session{padding:60px;text-align:center;color:var(--text3)}
.no-session-title{font-family:var(--sans);font-size:20px;font-weight:700;color:var(--text2);margin-bottom:10px}

/* SESSION PICKER */
.picker{padding:24px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;margin-bottom:24px}
.picker-title{font-family:var(--sans);font-size:13px;font-weight:700;color:var(--text2);margin-bottom:12px}
.session-btn{display:block;width:100%;text-align:left;padding:10px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:4px;margin-bottom:4px;cursor:pointer;font-family:var(--mono);font-size:11px;color:var(--text);transition:all .15s}
.session-btn:hover{border-color:var(--green);background:var(--green-dim);color:var(--green)}
.session-btn-meta{font-size:10px;color:var(--text3);margin-top:2px}
</style>
</head>
<body>

<nav class="nav no-print">
  <div class="nav-brand">QA Tester <span>Report</span></div>
  <div class="nav-acts">
    <button class="btn" onclick="window.print()">Print / Save PDF</button>
    <button class="btn btn-green" onclick="window.location.href='tester.html'">← Back to Tester</button>
  </div>
</nav>

<div class="page" id="page">
  <div class="no-session" id="noSession" style="display:none">
    <div class="no-session-title">No Report Available</div>
    <div style="font-size:12px;margin-bottom:20px">Select a session to view its report.</div>
    <div id="sessionPicker"></div>
  </div>
  <div id="reportContent"></div>
</div>

<script>
const STEPS_DEF = [
  { cat: "Layout & Structure", steps: [
    { n: "Viewport meta tag" },{ n: "Grid / column alignment" },{ n: "No horizontal overflow" },{ n: "Z-index stacking order" },{ n: "Footer position" }
  ]},
  { cat: "Typography", steps: [
    { n: "Web fonts load correctly" },{ n: "Heading hierarchy H1→H3" },{ n: "Text contrast WCAG AA" },{ n: "Text truncation & overflow" }
  ]},
  { cat: "Images & Media", steps: [
    { n: "All images have alt text" },{ n: "No broken images" },{ n: "Image aspect ratios correct" },{ n: "Video autoplay policy" }
  ]},
  { cat: "Forms", steps: [
    { n: "Required fields block submit" },{ n: "Email & phone validation" },{ n: "Password rules enforced" },
    { n: "Whitespace-only input rejected" },{ n: "Double-submit prevented" },{ n: "Success state shown clearly" },
    { n: "Server error handled gracefully" },{ n: "Form labels linked to inputs" }
  ]},
  { cat: "Interactivity", steps: [
    { n: "All links work" },{ n: "Button states styled" },{ n: "Keyboard navigation works" },{ n: "Mobile touch targets ≥ 44px" }
  ]},
  { cat: "Responsive Behavior", steps: [
    { n: "Mobile layout (320px)" },{ n: "Tablet layout (768px)" },{ n: "Tables responsive" }
  ]},
  { cat: "Performance & Console", steps: [
    { n: "Zero console errors" },{ n: "Zero 404 assets" },{ n: "Animations run at 60fps" }
  ]},
  { cat: "SEO & Meta", steps: [
    { n: "Favicon & page title" },{ n: "Open Graph tags present" }
  ]}
];

let ALL_STEPS = [];
let idx = 1;
STEPS_DEF.forEach(c => c.steps.forEach(s => {
  ALL_STEPS.push({ ...s, id: idx++, cat: c.cat });
}));

function getSessions() {
  try { return JSON.parse(localStorage.getItem('qa_sessions') || '[]'); } catch { return []; }
}

function getGrade(passRate, hasFail, openBugs) {
  if (openBugs > 0) return { g: 'F', l: 'Blocked — open bugs' };
  if (passRate === 100) return { g: 'A', l: 'Perfect score' };
  if (passRate >= 87) return { g: 'B', l: 'Good — minor issues' };
  if (passRate >= 70) return { g: 'C', l: 'Needs improvement' };
  if (passRate >= 50) return { g: 'D', l: 'Significant issues' };
  return { g: 'F', l: 'Critical failures' };
}

function renderReport(session) {
  const steps = ALL_STEPS.map(s => ({
    ...s,
    state: session.steps[s.id] || { status: 'open', bugs: [], notes: '' }
  }));

  const passed = steps.filter(s => s.state.status === 'pass').length;
  const failed = steps.filter(s => s.state.status === 'fail').length;
  const pending = steps.filter(s => s.state.status === 'open').length;
  const allBugs = steps.flatMap(s => s.state.bugs.map(b => ({ ...b, step: s })));
  const openBugs = allBugs.filter(b => !b.resolved).length;
  const resolvedBugs = allBugs.filter(b => b.resolved).length;
  const passRate = Math.round(passed / 30 * 100);
  const grade = getGrade(passRate, failed > 0, openBugs);

  const isPass = failed === 0 && pending === 0 && openBugs === 0;
  const createdAt = new Date(session.createdAt);
  const updatedAt = new Date(session.updatedAt || session.createdAt);

  // Category breakdown
  const cats = [...new Set(ALL_STEPS.map(s => s.cat))];

  let html = `
  <div class="report-header">
    <div class="report-tag">QA Test Report</div>
    <div class="report-title">${session.name || 'Untitled Session'}</div>
    <div class="report-url">${session.url}</div>
    <div class="report-meta">Session created: ${createdAt.toLocaleString()} &nbsp;|&nbsp; Last updated: ${updatedAt.toLocaleString()}</div>
  </div>

  <div class="grade-row">
    <div class="grade-card grade-${grade.g}">
      <div class="grade-letter">${grade.g}</div>
      <div class="grade-label">${grade.l}</div>
    </div>
    <div class="metrics-grid">
      <div class="metric"><div class="metric-n">${passRate}%</div><div class="metric-l">Pass rate</div></div>
      <div class="metric"><div class="metric-n" style="color:var(--green)">${passed}</div><div class="metric-l">Passed</div></div>
      <div class="metric"><div class="metric-n" style="color:var(--red)">${failed}</div><div class="metric-l">Failed</div></div>
      <div class="metric"><div class="metric-n" style="color:var(--amber)">${openBugs}</div><div class="metric-l">Open bugs</div></div>
      <div class="metric"><div class="metric-n" style="color:var(--text3)">${pending}</div><div class="metric-l">Pending</div></div>
      <div class="metric"><div class="metric-n">${allBugs.length}</div><div class="metric-l">Total bugs</div></div>
      <div class="metric"><div class="metric-n" style="color:var(--green)">${resolvedBugs}</div><div class="metric-l">Resolved</div></div>
      <div class="metric"><div class="metric-n">30</div><div class="metric-l">Total steps</div></div>
    </div>
  </div>

  <div class="verdict ${isPass ? 'pass' : 'fail'}">
    <div class="verdict-title">${isPass ? '✓ ACCEPTED — Site passes all 30 checks. Ready for release.' : '✗ NOT ACCEPTED — ' + (openBugs > 0 ? openBugs + ' open bug' + (openBugs !== 1 ? 's' : '') + ' must be resolved. ' : '') + (failed > 0 ? failed + ' step' + (failed !== 1 ? 's' : '') + ' failed. ' : '') + (pending > 0 ? pending + ' step' + (pending !== 1 ? 's' : '') + ' not yet tested.' : '')}</div>
    <div class="verdict-body">${isPass ? 'All visual, functional, form, responsive, performance, and SEO checks passed with zero open bugs.' : 'Cannot ship until all failed steps are resolved and bugs are marked as fixed. Re-run tests after fixes.'}</div>
  </div>

  <div class="cat-summary">
    <div class="section-title">Category Breakdown</div>
    ${cats.map(cat => {
      const catSteps = steps.filter(s => s.cat === cat);
      const cp = catSteps.filter(s => s.state.status === 'pass').length;
      const cf = catSteps.filter(s => s.state.status === 'fail').length;
      const pct = Math.round(cp / catSteps.length * 100);
      const barClass = cp === catSteps.length ? 'full' : cp > 0 ? 'partial' : 'none';
      const statusColor = cp === catSteps.length ? 'var(--green)' : cf > 0 ? 'var(--red)' : 'var(--text3)';
      const statusTxt = cp === catSteps.length ? '✓ all pass' : cf > 0 ? cf + ' failed' : 'pending';
      return `<div class="cat-row">
        <span class="cat-name">${cat}</span>
        <div class="cat-bar-wrap"><div class="cat-bar ${barClass}" style="width:${pct}%"></div></div>
        <span class="cat-pct">${pct}%</span>
        <span class="cat-status" style="color:${statusColor}">${statusTxt}</span>
      </div>`;
    }).join('')}
  </div>

  <div class="steps-section">
    <div class="section-title">All 30 Steps — Detailed Results</div>
    <table class="steps-table">
      <thead>
        <tr>
          <th style="width:30px">#</th>
          <th>Step</th>
          <th>Category</th>
          <th style="width:70px">Status</th>
          <th style="width:60px">Bugs</th>
        </tr>
      </thead>
      <tbody>
        ${steps.map(s => {
          const ob = s.state.bugs.filter(b => !b.resolved).length;
          const tb = s.state.bugs.length;
          return `<tr>
            <td style="color:var(--text3)">${String(s.id).padStart(2,'0')}</td>
            <td style="color:${s.state.status==='pass'?'var(--green)':s.state.status==='fail'?'var(--red)':'var(--text)'}">${s.n}</td>
            <td style="color:var(--text3)">${s.cat}</td>
            <td><span class="badge badge-${s.state.status}">${s.state.status}</span></td>
            <td style="color:${ob>0?'var(--red)':tb>0?'var(--green)':'var(--text3)'}">${ob>0?ob+' open':tb>0?'0 open':'-'}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>

  ${allBugs.length > 0 ? `
  <div class="bugs-section">
    <div class="section-title">Bug Report (${allBugs.length} total — ${openBugs} open, ${resolvedBugs} resolved)</div>
    ${steps.filter(s => s.state.bugs.length > 0).map(s => `
      <div class="bug-card">
        <div class="bug-card-head">
          <span>${s.n}</span>
          <span class="step-ref">Step ${String(s.id).padStart(2,'0')} · ${s.cat}</span>
        </div>
        <div class="bug-list">
          ${s.state.bugs.map(b => `
            <div class="bug-row">
              <div class="bug-dot ${b.resolved?'resolved':'open'}"></div>
              <div class="bug-txt ${b.resolved?'res':''}">${b.text}</div>
              <div class="bug-status">${b.resolved?'✓ resolved':'● open'}</div>
            </div>`).join('')}
        </div>
      </div>`).join('')}
  </div>` : ''}

  ${steps.some(s => s.state.notes && s.state.notes.trim()) ? `
  <div class="notes-section">
    <div class="section-title">Tester Notes</div>
    ${steps.filter(s => s.state.notes && s.state.notes.trim()).map(s => `
      <div class="note-row">
        <div class="note-step">Step ${String(s.id).padStart(2,'0')} — ${s.n}</div>
        <div class="note-text">${s.state.notes}</div>
      </div>`).join('')}
  </div>` : ''}

  <div class="report-footer">
    <span class="footer-brand">QA Visual Tester</span>
    <span class="footer-time">Report generated: ${new Date().toLocaleString()}</span>
  </div>`;

  document.getElementById('reportContent').innerHTML = html;
  document.getElementById('noSession').style.display = 'none';
}

function showPicker() {
  const ss = getSessions();
  document.getElementById('noSession').style.display = 'block';
  document.getElementById('reportContent').innerHTML = '';
  if (ss.length === 0) {
    document.getElementById('sessionPicker').innerHTML = '<div style="font-size:11px;color:var(--text3)">No sessions found. Go back to tester and create one.</div>';
    return;
  }
  let html = '<div class="picker"><div class="picker-title">Select a session to view its report</div>';
  ss.slice().reverse().forEach(s => {
    const steps = Object.values(s.steps || {});
    const passed = steps.filter(x => x.status === 'pass').length;
    const failed = steps.filter(x => x.status === 'fail').length;
    const d = new Date(s.createdAt);
    html += `<button class="session-btn" onclick="loadAndRender('${s.id}')">
      <div>${s.name || s.url}</div>
      <div class="session-btn-meta">${d.toLocaleString()} &nbsp;·&nbsp; ${passed} pass / ${failed} fail / ${30-passed-failed} pending</div>
    </button>`;
  });
  html += '</div>';
  document.getElementById('sessionPicker').innerHTML = html;
}

function loadAndRender(id) {
  const ss = getSessions();
  const session = ss.find(s => s.id === id);
  if (session) {
    document.getElementById('noSession').style.display = 'none';
    renderReport(session);
  }
}

// Init — check URL param or localStorage
const params = new URLSearchParams(window.location.search);
const sessionId = params.get('session') || localStorage.getItem('qa_current_session');
const sessions = getSessions();
const session = sessions.find(s => s.id === sessionId);
if (session) {
  renderReport(session);
} else {
  showPicker();
}
</script>
</body>
</html>
